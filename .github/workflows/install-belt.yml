name: Install championship belt asset
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-belt.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add belt asset and remove installer
        env:
          BELT_ASSET_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-360c-81f5-982e-d56144eadbe2/raw?se=2026-11-05T17%3A36%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=8957a743-76e8-4be6-bf4a-685dc371ac08&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T12%3A23%3A21Z&ske=2026-11-06T12%3A23%3A21Z&sks=b&skv=2026-02-06&sig=I1OCfRtX/jHgyfofBK/iepK56%2Bhh1Lgbi3AZ1OgAXCM%3D'
        run: |
          mkdir -p fight
          curl --fail --location "$BELT_ASSET_URL" --output fight/belt-1989.png
          file fight/belt-1989.png
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git rm .github/workflows/install-belt.yml
          git add fight/belt-1989.png
          git commit -m "Add jeweled 1989 championship belt asset"
          git push
